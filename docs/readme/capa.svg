<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="titulo desc">
<title id="titulo">bora de quê? Bateu a fome. Achou o prato.</title>
<desc id="desc">Agente de comida com IA: sugere pratos e mostra lugares reais perto do seu CEP.</desc>
<defs>
  <clipPath id="cartao"><rect width="1200" height="540" rx="28"/></clipPath>
  <filter id="borrao" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="sombra" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#350D28" flood-opacity=".14"/></filter>
  <radialGradient id="bola" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#FF5CA8"/><stop offset=".55" stop-color="#FF087E"/><stop offset="1" stop-color="#D6006A"/></radialGradient>
  <clipPath id="l1"><rect x="40" y="150" width="700" height="92"/></clipPath>
  <clipPath id="l2"><rect x="40" y="236" width="700" height="92"/></clipPath>
</defs>
<style>
  .d { font-family: Outfit, 'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
  .t { font-family: 'DM Sans', -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .e { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .m1 { animation: vagar1 16s ease-in-out infinite alternate; }
  .m2 { animation: vagar2 19s ease-in-out infinite alternate; }
  .m3 { animation: vagar1 23s ease-in-out infinite alternate-reverse; }
  @keyframes vagar1 { to { transform: translate(70px, 40px) scale(1.15); } }
  @keyframes vagar2 { to { transform: translate(-80px, -30px) scale(.9); } }
  .sobe { animation: sobe .9s cubic-bezier(.2,.9,.25,1.15) backwards; }
  .sobe.a2 { animation-delay: .25s; }
  .sobe.a3 { animation-delay: .55s; }
  .sobe.a4 { animation-delay: .75s; }
  @keyframes sobe { from { transform: translateY(90px); opacity: 0; } }
  .rabisco { stroke-dasharray: 640; animation: risca 1.1s .9s cubic-bezier(.6,0,.2,1) backwards; }
  @keyframes risca { from { stroke-dashoffset: 640; } }
  .anel { transform-origin: 925px 238px; animation: gira 46s linear infinite; }
  .anel.r2 { animation-duration: 70s; animation-direction: reverse; }
  .anel.r2 .contra { animation-direction: normal; animation-duration: 70s; }
  .contra { transform-box: fill-box; transform-origin: center; animation: gira 46s linear infinite reverse; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .pulso { transform-origin: 925px 238px; animation: pulso 2.6s ease-out infinite; }
  .pulso.p2 { animation-delay: 1.3s; }
  @keyframes pulso { from { transform: scale(1); opacity: .55; } to { transform: scale(1.9); opacity: 0; } }
  .lupa { animation: varre 3.2s ease-in-out infinite; }
  @keyframes varre { 0%,100% { transform: translate(0,0) rotate(0); } 30% { transform: translate(-7px,4px) rotate(-8deg); } 65% { transform: translate(6px,-3px) rotate(6deg); } }
  .flut { animation: boia 5s ease-in-out infinite; }
  .flut.f2 { animation-delay: -1.6s; animation-duration: 6s; }
  .flut.f3 { animation-delay: -3.1s; animation-duration: 5.5s; }
  @keyframes boia { 50% { transform: translateY(-10px); } }
  .vivo { animation: vivo 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes vivo { 50% { opacity: .35; transform: scale(1.5); } }
  .trilho { animation: corre 38s linear infinite; }
  @keyframes corre { to { transform: translateX(-3060px); } }
</style>
<g clip-path="url(#cartao)">
  <rect width="1200" height="540" fill="#FFF9F3"/>
  <g filter="url(#borrao)" opacity=".55">
