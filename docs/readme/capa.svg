    </g>
  </g>

  <g clip-path="url(#l1)"><text class="d sobe a2" x="60" y="222" font-size="76" fill="#350D28" letter-spacing="-2.5" textLength="585" lengthAdjust="spacingAndGlyphs">BATEU A FOME.</text></g>
  <g clip-path="url(#l2)"><text class="d sobe a3" x="60" y="306" font-size="76" fill="#FF087E" letter-spacing="-2.5" textLength="640" lengthAdjust="spacingAndGlyphs">ACHOU O PRATO.</text></g>
  <path class="rabisco" d="M64 330 C 170 314, 290 342, 420 324 S 610 316, 700 328" fill="none" stroke="#3DF2D0" stroke-width="9" stroke-linecap="round"/>

  <g class="sobe a4">
    <text class="t" x="64" y="378" font-size="20" fill="#350D28" fill-opacity=".78">Diga o que bateu vontade. Eu sugiro <tspan font-weight="700" fill="#350D28" fill-opacity="1">pratos</tspan> e mostro</text>
    <text class="t" x="64" y="406" font-size="20" fill="#350D28" fill-opacity=".78"><tspan font-weight="700" fill="#350D28" fill-opacity="1">lugares reais</tspan> perto do seu CEP, com distância e horário.</text>
