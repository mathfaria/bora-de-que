<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="titulo">
<title id="titulo">Do CEP ao prato em quatro passos: nome e CEP, mapa real em segundo plano, pratos sugeridos pelo agente, lugares por perto sem LLM.</title>
<defs>
  <clipPath id="cartao"><rect width="1200" height="330" rx="28"/></clipPath>
  <filter id="sombra" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#350D28" flood-opacity=".13"/></filter>
  <filter id="brilho" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
  .d { font-family: Outfit, 'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
  .t { font-family: 'DM Sans', -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .e { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .fio { stroke-dasharray: 2 12; animation: fio 1.2s linear infinite; }
  @keyframes fio { to { stroke-dashoffset: -14; } }
  .no { transform-box: fill-box; transform-origin: center; animation: acende 5s ease-in-out infinite; }
  @keyframes acende { 0%, 30%, 100% { transform: scale(1); } 10% { transform: scale(1.1); } }
  .onda { transform-box: fill-box; transform-origin: center; animation: onda 5s ease-out infinite; opacity: 0; }
  @keyframes onda { 0% { transform: scale(1); opacity: .7; } 22% { transform: scale(1.55); opacity: 0; } 100% { opacity: 0; } }
</style>
<g clip-path="url(#cartao)">
  <rect width="1200" height="330" fill="#FFF9F3"/>
  <path d="M150 104 L1050 104" stroke="#350D28" stroke-opacity=".12" stroke-width="10" stroke-linecap="round"/>
  <path class="fio" d="M150 104 L1050 104" stroke="#FF087E" stroke-width="4" stroke-linecap="round" fill="none"/>
  <g>
    <circle r="11" fill="#FF087E" opacity=".5" filter="url(#brilho)"/>
    <circle r="7" fill="#FF087E"/>
    <animateMotion dur="5s" repeatCount="indefinite" path="M150 104 L1050 104" keyPoints="0;0;0.333;0.333;0.667;0.667;1;1" keyTimes="0;0.05;0.2;0.3;0.45;0.55;0.7;1" calcMode="spline" keySplines="0 0 1 1;.6 0 .2 1;0 0 1 1;.6 0 .2 1;0 0 1 1;.6 0 .2 1;0 0 1 1"/>
  </g>
  <g class="no" style="animation-delay:0.0s"><circle class="onda" cx="150" cy="104" r="48" fill="none" stroke="#FF087E" stroke-width="3" style="animation-delay:0.0s"/><circle cx="150" cy="104" r="48" fill="#fff" filter="url(#sombra)"/><circle cx="150" cy="104" r="48" fill="none" stroke="#FF087E" stroke-width="4"/><text class="e" x="150" y="117" font-size="36" text-anchor="middle">📍</text></g><text class="t" x="150" y="190" font-size="13" font-weight="700" fill="#FF087E" text-anchor="middle" letter-spacing="2">PASSO 01</text><text class="d" x="150" y="218" font-size="24" fill="#350D28" text-anchor="middle">Nome + CEP</text><text class="t" x="150" y="246" font-size="15.5" fill="#350D28" fill-opacity=".72" text-anchor="middle">O CEP vira bairro, cidade</text><text class="t" x="150" y="268" font-size="15.5" fill="#350D28" fill-opacity=".72" text-anchor="middle">e coordenadas.</text><g transform="translate(150,306)"><rect x="-82" y="-15" width="164" height="30" rx="15" fill="#FF087E"/><text class="t" x="0" y="5" font-size="13" font-weight="700" fill="#350D28" text-anchor="middle">1 a 2 s</text></g><g class="no" style="animation-delay:1.25s"><circle class="onda" cx="450" cy="104" r="48" fill="none" stroke="#3DF2D0" stroke-width="3" style="animation-delay:1.25s"/><circle cx="450" cy="104" r="48" fill="#fff" filter="url(#sombra)"/><circle cx="450" cy="104" r="48" fill="none" stroke="#3DF2D0" stroke-width="4"/><text class="e" x="450" y="117" font-size="36" text-anchor="middle">🗺️</text></g><text class="t" x="450" y="190" font-size="13" font-weight="700" fill="#FF087E" text-anchor="middle" letter-spacing="2">PASSO 02</text><text class="d" x="450" y="218" font-size="24" fill="#350D28" text-anchor="middle">Mapa real</text><text class="t" x="450" y="246" font-size="15.5" fill="#350D28" fill-opacity=".72" text-anchor="middle">Restaurantes do OpenStreetMap</text><text class="t" x="450" y="268" font-size="15.5" fill="#350D28" fill-opacity=".72" text-anchor="middle">baixam em segundo plano.</text><g transform="translate(450,306)"><rect x="-82" y="-15" width="164" height="30" rx="15" fill="#3DF2D0"/><text class="t" x="0" y="5" font-size="13" font-weight="700" fill="#350D28" text-anchor="middle">enquanto você lê</text></g><g class="no" style="animation-delay:2.5s"><circle class="onda" cx="750" cy="104" r="48" fill="none" stroke="#D9FF43" stroke-width="3" style="animation-delay:2.5s"/><circle cx="750" cy="104" r="48" fill="#fff" filter="url(#sombra)"/><circle cx="750" cy="104" r="48" fill="none" stroke="#D9FF43" stroke-width="4"/><text class="e" x="750" y="117" font-size="36" text-anchor="middle">🍽️</text></g><text class="t" x="750" y="190" font-size="13" font-weight="700" fill="#FF087E" text-anchor="middle" letter-spacing="2">PASSO 03</text><text class="d" x="750" y="218" font-size="24" fill="#350D28" text-anchor="middle">Pratos</text><text class="t" x="750" y="246" font-size="15.5" fill="#350D28" fill-opacity=".72" text-anchor="middle">O agente sugere pratos</text><text class="t" x="750" y="268" font-size="15.5" fill="#350D28" fill-opacity=".72" text-anchor="middle">e diz por que cada um.</text><g transform="translate(750,306)"><rect x="-82" y="-15" width="164" height="30" rx="15" fill="#D9FF43"/><text class="t" x="0" y="5" font-size="13" font-weight="700" fill="#350D28" text-anchor="middle">~3 s com Gemini</text></g><g class="no" style="animation-delay:3.75s"><circle class="onda" cx="1050" cy="104" r="48" fill="none" stroke="#350D28" stroke-width="3" style="animation-delay:3.75s"/><circle cx="1050" cy="104" r="48" fill="#fff" filter="url(#sombra)"/><circle cx="1050" cy="104" r="48" fill="none" stroke="#350D28" stroke-width="4"/><text class="e" x="1050" y="117" font-size="36" text-anchor="middle">🚶</text></g><text class="t" x="1050" y="190" font-size="13" font-weight="700" fill="#FF087E" text-anchor="middle" letter-spacing="2">PASSO 04</text><text class="d" x="1050" y="218" font-size="24" fill="#350D28" text-anchor="middle">Onde comer</text><text class="t" x="1050" y="246" font-size="15.5" fill="#350D28" fill-opacity=".72" text-anchor="middle">Lugares perto, com distância,</text><text class="t" x="1050" y="268" font-size="15.5" fill="#350D28" fill-opacity=".72" text-anchor="middle">horário e site.</text><g transform="translate(1050,306)"><rect x="-82" y="-15" width="164" height="30" rx="15" fill="#350D28"/><text class="t" x="0" y="5" font-size="13" font-weight="700" fill="#FFF9F3" text-anchor="middle">sem LLM · instantâneo</text></g>
</g>
</svg>
