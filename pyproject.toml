[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bocado"
version = "0.2.0"
description = "Agente de IA que sugere pratos e mostra lugares reais perto do CEP, com busca híbrida, modelo ajustado e avaliações."
authors = [{ name = "Matheus Faria" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "httpx>=0.27",
    "fastembed>=0.5",
    "google-genai>=1.30",
]

[project.optional-dependencies]
# Inferência do modelo ajustado (CPU/MPS)
modelo = ["torch>=2.3", "transformers>=4.45", "accelerate>=0.30", "huggingface_hub>=0.24"]
# Treino com LoRA no Apple Silicon
treino = ["mlx-lm>=0.20", "huggingface_hub>=0.24"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "pgserver>=0.1.4"]

[project.scripts]
bocado = "bocado.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bocado = ["web/*", "schema.sql"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
